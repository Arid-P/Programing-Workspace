<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Advocate Diary{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script defer src="{{ url_for('static', filename='js/ui.js') }}"></script>
</head>
<body>

{% if show_sidebar %}
<header class="topbar">
    <button class="menu-btn" onclick="toggleSidebar()">☰</button>
    <div class="brand">⚖ Advocate Diary</div>
</header>
{% endif %}

<div class="app-container">
    {% if show_sidebar %}
    <aside id="sidebar" class="sidebar">
        <a href="/advocate">Dashboard</a>
        <a href="#">Today</a>
        <a href="#">Calendar</a>
        <a href="#">Clients</a>
        <a href="#">Logout</a>
    </aside>
    {% endif %}

    <main class="main-content {% if not show_sidebar %}full{% endif %}">
        {% block content %}{% endblock %}
    </main>
</div>

</body>
</html>
